# --- Project ---
name = "pmv-site"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# --- Bindings (IDs provisioned in Cloudflare on 2026-08-02) ---
[[d1_databases]]
binding = "DB"
database_name = "pmv"
database_id = "bb86b0a6-4756-41bf-bdb5-d8bb7fe4d502"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "d88bb30fe5544ba5aac0f5e74ce58234"

# --- Vars (non-secret, safe to commit) ---
# RESEND_FROM_EMAIL: which "from" address email notifications send as. Only
# used if RESEND_API_KEY is set (a secret, below); must be a domain verified
# in Resend. Uncomment and update once a sending domain is verified — until
# then email sending no-ops.
# [vars]
# RESEND_FROM_EMAIL = "Pinnacle Management Ventures <notifications@pinnaclemanagementventures.com>"

# --- Secrets (NOT set here — see DEPLOY.md "Environment variables" table) ---
# Required: SESSION_SECRET, PAYMENT_ENCRYPTION_KEY
# Optional: RESEND_API_KEY
# Local dev: copy .dev.vars.example to .dev.vars and fill in test values.
# Deployed: `wrangler pages secret put <NAME>`, or the Cloudflare dashboard.
