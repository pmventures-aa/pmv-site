# --- Project ---
name = "pmv-site"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# --- Bindings (IDs provisioned in Cloudflare on 2026-08-02) ---
[[d1_databases]]
binding = "DB"
database_name = "pmv"
database_id = "bb86b0a6-4756-41bf-bdb5-d8bb7fe4d502"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "d88bb30fe5544ba5aac0f5e74ce58234"

# Document + profile-picture storage. The pmv-uploads bucket was created
# 2026-08-03 (Cloudflare account R2 subscription activated same day).
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "pmv-uploads"

# --- Vars (non-secret, safe to commit) ---
# RESEND_FROM_EMAIL: which "from" address email notifications send as. Only
# used if RESEND_API_KEY is set (a secret, below); must be a domain verified
# in Resend. Uncomment and update once a sending domain is verified — until
# then email sending no-ops.
[vars]
RESEND_FROM_EMAIL = "Pinnacle Management Ventures <notifications@pinnaclemanagementventures.com>"
# Receiving stays on Resend's managed domain so pinnaclemanagementventures.com
# MX records (Apple/iCloud for orders@) are never replaced. From/send is unchanged.
RESEND_INBOUND_DOMAIN = "ziloifaluk.resend.app"
# Which Zoom user hosts generated consultation meetings. Not a secret: it is
# just an address. The three Zoom credentials are secrets and are set
# separately. With them unset, bookings still work and simply carry no link.
ZOOM_HOST_EMAIL = "cjenkins@pinnaclemanagementventures.com"

# --- Secrets (NOT set here — see DEPLOY.md "Environment variables" table) ---
# Required: SESSION_SECRET, PAYMENT_ENCRYPTION_KEY
# Optional: RESEND_API_KEY, RESEND_WEBHOOK_SECRET (HQ can also store the webhook signing secret)
# Optional: ZOOM_ACCOUNT_ID, ZOOM_CLIENT_ID, ZOOM_CLIENT_SECRET (Server-to-Server OAuth app)
# Local dev: copy .dev.vars.example to .dev.vars and fill in test values.
# Deployed: `wrangler pages secret put <NAME>`, or the Cloudflare dashboard.
