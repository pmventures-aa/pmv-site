name: Run client nurture campaign

on:
  schedule:
    - cron: '20 14 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-nurture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nurture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process due Pinnacle client nurture emails
        env:
          PMV_AUTOMATION_SECRET: ${{ secrets.PMV_AUTOMATION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PMV_AUTOMATION_SECRET"
          curl --fail --silent --show-error --request POST \
            --header "x-pmv-automation-secret: $PMV_AUTOMATION_SECRET" \
            https://pmv-site.pages.dev/api/automation/nurture/run
