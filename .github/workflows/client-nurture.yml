name: Run client nurture campaign

on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:

jobs:
  nurture:
    runs-on: ubuntu-latest
    steps:
      - name: Process due Pinnacle client nurture emails
        env:
          PMV_AUTOMATION_SECRET: ${{ secrets.PMV_AUTOMATION_SECRET }}
        run: |
          test -n "$PMV_AUTOMATION_SECRET"
          curl --fail --silent --show-error --request POST \
            --header "x-pmv-automation-secret: $PMV_AUTOMATION_SECRET" \
            https://www.pinnaclemanagementventures.com/api/automation/nurture/run
