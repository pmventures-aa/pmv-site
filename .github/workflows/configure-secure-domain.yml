name: Configure secure PMV application domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-secure-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Attach secure domain to Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/pmv-site/domains"
          auth=( -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' )

          existing="$(curl --fail --silent --show-error "${auth[@]}" "$api")"
          if echo "$existing" | jq -e '.result[]? | select(.name == "secure.pinnaclemanagementventures.com")' >/dev/null; then
            echo 'secure.pinnaclemanagementventures.com is already attached to the Pages project.'
          else
            created="$(curl --fail --silent --show-error --request POST "${auth[@]}" --data '{"name":"secure.pinnaclemanagementventures.com"}' "$api")"
            echo "$created" | jq -e '.success == true' >/dev/null
            echo 'Attached secure.pinnaclemanagementventures.com to the Pages project.'
          fi

          for attempt in $(seq 1 18); do
            current="$(curl --fail --silent --show-error "${auth[@]}" "$api/secure.pinnaclemanagementventures.com")"
            status="$(echo "$current" | jq -r '.result.status // "unknown"')"
            echo "Pages domain status: $status"
            if [[ "$status" == 'active' ]]; then
              break
            fi
            if [[ "$status" == 'error' || "$status" == 'blocked' ]]; then
              echo "$current" | jq '{success, errors, messages, result: {name: .result.name, status: .result.status, validation_data: .result.validation_data, verification_data: .result.verification_data}}'
              exit 1
            fi
            sleep 5
          done

          getent ahosts secure.pinnaclemanagementventures.com | head -n 2
