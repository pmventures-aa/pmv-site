name: Configure secure PMV DNS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-secure-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create secure CNAME in Cloudflare DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          auth=( -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' )
          zones="$(curl --fail --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=pinnaclemanagementventures.com&account.id=$CLOUDFLARE_ACCOUNT_ID")"
          zone_id="$(echo "$zones" | jq -r '.result[0].id // empty')"
          if [[ -z "$zone_id" ]]; then
            echo 'Cloudflare token cannot locate the pinnaclemanagementventures.com zone.'
            exit 2
          fi

          dns_api="https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"
          records="$(curl --fail --silent --show-error "${auth[@]}" "$dns_api?type=CNAME&name=secure.pinnaclemanagementventures.com")"
          record_id="$(echo "$records" | jq -r '.result[0].id // empty')"

          payload='{"type":"CNAME","name":"secure.pinnaclemanagementventures.com","content":"pmv-site.pages.dev","ttl":1,"proxied":true,"comment":"Pinnacle secure client and HQ application host"}'
          if [[ -n "$record_id" ]]; then
            updated="$(curl --fail --silent --show-error --request PUT "${auth[@]}" --data "$payload" "$dns_api/$record_id")"
            echo "$updated" | jq -e '.success == true' >/dev/null
            echo 'Updated existing secure CNAME.'
          else
            created="$(curl --fail --silent --show-error --request POST "${auth[@]}" --data "$payload" "$dns_api")"
            echo "$created" | jq -e '.success == true' >/dev/null
            echo 'Created secure CNAME.'
          fi

          pages_api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/pmv-site/domains/secure.pinnaclemanagementventures.com"
          for attempt in $(seq 1 24); do
            current="$(curl --fail --silent --show-error "${auth[@]}" "$pages_api")"
            status="$(echo "$current" | jq -r '.result.status // "unknown"')"
            echo "Pages domain status: $status"
            if [[ "$status" == 'active' ]]; then
              break
            fi
            if [[ "$status" == 'error' || "$status" == 'blocked' ]]; then
              echo "$current" | jq '{success, errors, messages, result: {name: .result.name, status: .result.status, validation_data: .result.validation_data, verification_data: .result.verification_data}}'
              exit 1
            fi
            sleep 5
          done

          getent ahosts secure.pinnaclemanagementventures.com | head -n 2
