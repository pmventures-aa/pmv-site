name: Finalize e-sign v2 release

on:
  push:
    branches: [agent/esign-enterprise-v2]
    paths:
      - '.github/workflows/finalize-esign-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esign-enterprise-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final document-platform corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/_lib/routes/documentPlatformV2.ts')
          s=p.read_text()
          s=s.replace('body.client_id||null,null,sourceFileId','body.client_id||null,id,sourceFileId')
          old="await c.env.DB.prepare('UPDATE document_fields SET required=?,label=?,validation_json=?,condition_json=?,validation_error_message=?,updated_at=? WHERE id=?').bind(b.required===false?0:b.required===true?1:f.required,b.label!==undefined?String(b.label).slice(0,180):f.label,JSON.stringify(validation),Object.keys(condition).length?JSON.stringify(condition):null,b.error_message!==undefined?String(b.error_message).slice(0,300):f.validation_error_message,now(),f.id).run()"
          new="await c.env.DB.prepare('UPDATE document_fields SET required=?,label=?,validation_json=?,condition_json=?,validation_error_message=?,envelope_document_id=COALESCE(?,envelope_document_id),updated_at=? WHERE id=?').bind(b.required===false?0:b.required===true?1:f.required,b.label!==undefined?String(b.label).slice(0,180):f.label,JSON.stringify(validation),Object.keys(condition).length?JSON.stringify(condition):null,b.error_message!==undefined?String(b.error_message).slice(0,300):f.validation_error_message,b.envelope_document_id!==undefined?(b.envelope_document_id||null):null,now(),f.id).run()"
          if old not in s: raise SystemExit('field rule target not found')
          p.write_text(s.replace(old,new))

          u=Path('src/pages/admin/EnvelopeWorkspaceEnterprise.tsx')
          x=u.read_text()
          old2="<div className=\"mt-3 grid gap-2 sm:grid-cols-2\"><select className={inputCls} value={d.format}"
          new2="<div className=\"mt-3 grid gap-2 sm:grid-cols-2\"><select className={inputCls} value={f.envelope_document_id||''} onChange={async e=>{try{await api.patch(`/admin/document-platform/envelopes/${selected}/fields/${f.id}/rules`,{envelope_document_id:e.target.value||null});await loadSelected()}catch(err){toast.error(err instanceof ApiError?err.message:'Could not assign field document')}}}><option value=\"\">Primary document</option>{packet.map(doc=><option key={doc.id} value={doc.id}>{doc.title}</option>)}</select><select className={inputCls} value={d.format}"
          if old2 not in x: raise SystemExit('field UI target not found')
          u.write_text(x.replace(old2,new2))
          PY
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit validated final corrections
        run: |
          git config user.name 'pmventures-aa'
          git config user.email 'c.raymondjenkins@gmail.com'
          git add functions/_lib/routes/documentPlatformV2.ts src/pages/admin/EnvelopeWorkspaceEnterprise.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'finalize template lineage and per-document field controls'
          git push origin HEAD:agent/esign-enterprise-v2
