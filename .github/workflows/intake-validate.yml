name: Validate editable service offerings

on:
  push:
    branches: [agent/editable-service-offerings]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/editable-service-offerings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations locally
        run: npm run db:migrate:local
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
