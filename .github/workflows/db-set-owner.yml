name: One-off - set is_owner for cjenkins account

on:
  workflow_dispatch:

jobs:
  set-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify target account exists in team_members
        run: |
          npx wrangler d1 execute pmv --remote --command "
            SELECT u.id, u.email, tm.id AS team_member_id, tm.is_owner
            FROM users u JOIN team_members tm ON tm.user_id = u.id
            WHERE u.email = 'cjenkins@pinnaclemanagementventures.com';
          "
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: Set is_owner = 1
        run: |
          npx wrangler d1 execute pmv --remote --command "
            UPDATE team_members SET is_owner = 1
            WHERE user_id = (SELECT id FROM users WHERE email = 'cjenkins@pinnaclemanagementventures.com');
          "
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: Confirm
        run: |
          npx wrangler d1 execute pmv --remote --command "
            SELECT u.email, tm.is_owner FROM users u JOIN team_members tm ON tm.user_id = u.id
            WHERE u.email = 'cjenkins@pinnaclemanagementventures.com';
          "
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
