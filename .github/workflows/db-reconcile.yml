name: Reconcile production D1 with migration history

on:
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 0001, 0002, 0004, 0005, 0014 already confirmed present in production
      # (0014 via the earlier audit_log hotfix) — every remaining migration
      # below is additive (CREATE TABLE / ADD COLUMN / CREATE INDEX /
      # CREATE TRIGGER) except 0006, which only drops two confirmed-empty
      # legacy tables (otp_codes, sessions — 0 rows each, verified read-only
      # beforehand). None of this touches existing client/user data.
      - name: 0003 - realign services catalog
        run: npx wrangler d1 execute pmv --remote --file=migrations/0003_realign_services.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0006 - drop unused otp/session tables (confirmed 0 rows)
        run: npx wrangler d1 execute pmv --remote --file=migrations/0006_drop_unused_otp_tables.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0007 - service applications
        run: npx wrangler d1 execute pmv --remote --file=migrations/0007_service_applications.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0008 - pipelines, permissions, notifications
        run: npx wrangler d1 execute pmv --remote --file=migrations/0008_pipelines_permissions_notifications.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0009 - avatars and notes
        run: npx wrangler d1 execute pmv --remote --file=migrations/0009_avatars_and_notes.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0010 - notification sound pref
        run: npx wrangler d1 execute pmv --remote --file=migrations/0010_notification_sound_pref.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0011 - missing client indexes
        run: npx wrangler d1 execute pmv --remote --file=migrations/0011_missing_client_indexes.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0012 - owner role and deletion controls
        run: npx wrangler d1 execute pmv --remote --file=migrations/0012_owner_role_and_deletion_controls.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0013 - lead conversion
        run: npx wrangler d1 execute pmv --remote --file=migrations/0013_lead_conversion.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      # 0014 skipped - audit_log table already created by the earlier hotfix

      - name: 0015 - reporting attribution
        run: npx wrangler d1 execute pmv --remote --file=migrations/0015_reporting_attribution.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0016 - employee metrics
        run: npx wrangler d1 execute pmv --remote --file=migrations/0016_employee_metrics.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0017 - report and audit capabilities
        run: npx wrangler d1 execute pmv --remote --file=migrations/0017_report_and_audit_capabilities.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0018 - activity audit trigger
        run: npx wrangler d1 execute pmv --remote --file=migrations/0018_activity_audit_trigger.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: 0019 - ticket resolved_at
        run: npx wrangler d1 execute pmv --remote --file=migrations/0019_ticket_resolved_at.sql
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      # Backfill wrangler's own bookkeeping table so `npm run db:migrate`
      # (db-migrate.yml) sees every migration up through here as already
      # applied, instead of trying to replay this history again on the
      # next push to main.
      - name: Backfill d1_migrations bookkeeping
        run: |
          npx wrangler d1 execute pmv --remote --command "
            INSERT OR IGNORE INTO d1_migrations (name) VALUES
              ('0001_init.sql'),
              ('0002_portal_expansion.sql'),
              ('0003_realign_services.sql'),
              ('0004_contact_inquiries.sql'),
              ('0005_tos_acceptance.sql'),
              ('0006_drop_unused_otp_tables.sql'),
              ('0007_service_applications.sql'),
              ('0008_pipelines_permissions_notifications.sql'),
              ('0009_avatars_and_notes.sql'),
              ('0010_notification_sound_pref.sql'),
              ('0011_missing_client_indexes.sql'),
              ('0012_owner_role_and_deletion_controls.sql'),
              ('0013_lead_conversion.sql'),
              ('0014_audit_log.sql'),
              ('0015_reporting_attribution.sql'),
              ('0016_employee_metrics.sql'),
              ('0017_report_and_audit_capabilities.sql'),
              ('0018_activity_audit_trigger.sql'),
              ('0019_ticket_resolved_at.sql');
          "
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
