name: One-shot strict Communications delivery wireup

on:
  push:
    branches: [agent/crm-records-communications]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crm-records-communications
          fetch-depth: 0
      - name: Use strict Resend delivery for campaigns
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/_lib/routes/comms.ts')
          text = p.read_text()
          text = text.replace("import { sendEmail } from '../email'", "import { sendEmailStrict } from '../email'")
          text = text.replace("await sendEmail(env, { to: r.email, subject, html: bodyHtml })", "const providerMessageId = await sendEmailStrict(env, { to: r.email, subject, html: bodyHtml })")
          text = text.replace("env.DB.prepare(\"UPDATE comms_recipients SET status = 'sent', sent_at = datetime('now') WHERE id = ?\").bind(r.row_id),", "env.DB.prepare(\"UPDATE comms_recipients SET status = 'sent', provider_message_id = ?, sent_at = datetime('now') WHERE id = ?\").bind(providerMessageId, r.row_id),")
          p.write_text(text)
          PY
          rm .github/workflows/comms-strict-wireup.yml
      - name: Commit strict delivery wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/routes/comms.ts .github/workflows/comms-strict-wireup.yml
          git commit -m "Track real provider delivery status for CRM communications"
          git push origin HEAD:agent/crm-records-communications
