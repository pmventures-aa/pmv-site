name: Enterprise release quality gate

on:
  push:
    branches:
      - agent/hq-enterprise-controls-public-polish
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: enterprise-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
