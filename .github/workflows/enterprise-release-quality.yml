name: Enterprise release quality gate

on:
  push:
    branches:
      - agent/hq-enterprise-controls-public-polish
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: enterprise-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The vitest suite peaks near Node's default ~4GB heap; give it headroom so
    # a normal run does not flake with "JavaScript heap out of memory".
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Replay D1 migrations from an empty local database
        run: npm run db:migrate:local
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Enforce user-facing dash style
        shell: bash
        run: |
          if grep -RIn --include='*.tsx' --include='*.ts' '—' src; then
            echo 'User-facing source still contains em dashes. Replace them with clearer punctuation before release.'
            exit 1
          fi
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
