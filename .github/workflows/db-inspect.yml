name: Inspect D1 schema (read-only)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Columns - users
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(users)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - team_members
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(team_members)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - contact_inquiries
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(contact_inquiries)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - matters
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(matters)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - client_tasks
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(client_tasks)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - invoices
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(invoices)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - client_documents
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(client_documents)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - support_tickets
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(support_tickets)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - internal_notes
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(internal_notes)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - onboarding_questions
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(onboarding_questions)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - activity_events
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(activity_events)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Columns - secure_messages
        run: npx wrangler d1 execute pmv --remote --command "PRAGMA table_info(secure_messages)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Row counts - otp_codes and sessions (legacy tables 0006 wants dropped)
        run: npx wrangler d1 execute pmv --remote --command "SELECT (SELECT COUNT(*) FROM otp_codes) AS otp_codes_rows, (SELECT COUNT(*) FROM sessions) AS sessions_rows"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
