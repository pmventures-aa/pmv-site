name: One-shot CRM wireup cleanup

on:
  push:
    branches: [agent/crm-records-communications]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crm-records-communications
          fetch-depth: 0
      - name: Wire CRM UI and strict types
        run: |
          python - <<'PY'
          from pathlib import Path

          # Final strict TS issue + a read-only owner directory for CRM records.
          p = Path('functions/_lib/routes/crm.ts')
          text = p.read_text()
          text = text.replace("body.inquiry_ids.filter((v) => typeof v === 'string')", "body.inquiry_ids.filter((v: unknown) => typeof v === 'string')")
          marker = "crmRoutes.get('/crm/lists', async (c) => {"
          directory = """crmRoutes.get('/crm/staff-directory', async (c) => {\n  const res = await c.env.DB.prepare(\n    `SELECT id, full_name, email FROM users WHERE role IN ('staff','admin') AND status = 'active' ORDER BY COALESCE(full_name, email)`,\n  ).all()\n  return c.json({ staff: res.results ?? [] })\n})\n\n"""
          if directory not in text:
              text = text.replace(marker, directory + marker)
          p.write_text(text)

          # Lead owner selector uses CRM-scoped staff directory.
          p = Path('src/pages/admin/LeadDetail.tsx')
          text = p.read_text().replace("'/admin/staff-directory'", "'/admin/crm/staff-directory'")
          p.write_text(text)

          # New record form must use the first-class CRM create route.
          p = Path('src/pages/admin/CRMRecordsAdmin.tsx')
          text = p.read_text()
          old = """      const name = draft.record_type === 'business' ? draft.company_name : `${draft.first_name} ${draft.last_name}`.trim()\n      await api.post('/admin/inquiries', {\n        name,\n        email: draft.email,\n        phone: draft.phone || undefined,\n        message: draft.message,\n      })\n      // The legacy creation endpoint establishes the compatible row; enrich it\n      // after reload from the record page. CSV imports can populate every CRM field.\n      toast.success('Lead added. Open the profile to add business details and ownership.')\n      setDraft(emptyRecord)\n      setShowCreate(false)\n      await load()"""
          new = """      const result = await api.post<{ id: string }>('/admin/crm/records', {\n        ...draft,\n        company_name: draft.company_name || undefined,\n        phone: draft.phone || undefined,\n        job_title: draft.job_title || undefined,\n        source: draft.source || 'Manual entry',\n      })\n      toast.success('CRM record created.')\n      setDraft(emptyRecord)\n      setShowCreate(false)\n      window.location.href = p(`leads/${result.id}`)"""
          if old not in text:
              raise SystemExit('CRMRecords createRecord block not found')
          text = text.replace(old, new)
          p.write_text(text)

          # Use the CRM-aware communications workspace.
          p = Path('src/pages/admin/AdminApp.tsx')
          text = p.read_text()
          text = text.replace("import CommunicationsAdmin from './CommunicationsAdmin'", "import CommunicationsCRMAdmin from './CommunicationsCRMAdmin'")
          text = text.replace('<Route path="communications" element={<CommunicationsAdmin />} />', '<Route path="communications" element={<CommunicationsCRMAdmin />} />')
          p.write_text(text)
          PY
          rm .github/workflows/crm-wireup-fix.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/routes/crm.ts src/pages/admin/LeadDetail.tsx src/pages/admin/CRMRecordsAdmin.tsx src/pages/admin/AdminApp.tsx .github/workflows/crm-wireup-fix.yml
          git commit -m "Wire CRM record creation, ownership, and communications UI"
          git push origin HEAD:agent/crm-records-communications
