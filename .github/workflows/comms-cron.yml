name: Communications Center — flush due sends

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/comms-cron.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: bb86b0a6-4756-41bf-bdb5-d8bb7fe4d502
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: "Pinnacle Management Ventures <notifications@pinnaclemanagementventures.com>"
