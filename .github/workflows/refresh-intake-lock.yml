name: Refresh intake dependency lockfile

on:
  push:
    branches: [agent/intake-application-wizard]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/intake-application-wizard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only
      - name: Commit refreshed package-lock
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh dependency lockfile"
          git fetch origin agent/intake-application-wizard
          git rebase origin/agent/intake-application-wizard
          git push origin HEAD:agent/intake-application-wizard
