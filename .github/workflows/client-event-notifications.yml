name: Process client event notifications

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver queued Pinnacle client notifications
        env:
          PMV_AUTOMATION_SECRET: ${{ secrets.PMV_AUTOMATION_SECRET }}
        run: |
          test -n "$PMV_AUTOMATION_SECRET"
          curl --fail --silent --show-error --request POST \
            --header "x-pmv-automation-secret: $PMV_AUTOMATION_SECRET" \
            https://www.pinnaclemanagementventures.com/api/automation/client-notifications/run
