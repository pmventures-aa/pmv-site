name: Process client event notifications

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-event-notifications.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deliver queued Pinnacle client notifications
        env:
          PMV_AUTOMATION_SECRET: ${{ secrets.PMV_AUTOMATION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PMV_AUTOMATION_SECRET"
          curl --fail --silent --show-error --request POST \
            --header "x-pmv-automation-secret: $PMV_AUTOMATION_SECRET" \
            https://pmv-site.pages.dev/api/automation/client-notifications/run
