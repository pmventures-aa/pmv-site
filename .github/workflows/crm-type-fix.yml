name: One-shot CRM type cleanup

on:
  push:
    branches: [agent/crm-records-communications]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crm-records-communications
          fetch-depth: 0
      - name: Normalize strict request typing
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['functions/_lib/routes/crm.ts', 'functions/_lib/routes/crmWrites.ts']:
              p = Path(name)
              text = p.read_text()
              text = text.replace('.catch(() => ({}))', '.catch(() => ({} as any))')
              p.write_text(text)

          p = Path('functions/_lib/routes/comms.ts')
          text = p.read_text().replace("const id = c.req.param('id')", "const id = c.req.param('id') ?? ''")
          p.write_text(text)
          PY
          rm .github/workflows/crm-type-fix.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/routes/crm.ts functions/_lib/routes/crmWrites.ts functions/_lib/routes/comms.ts .github/workflows/crm-type-fix.yml
          git commit -m "Fix strict typing in CRM routes"
          git push origin HEAD:agent/crm-records-communications
