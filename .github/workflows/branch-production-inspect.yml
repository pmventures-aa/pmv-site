name: Branch production identity inspection

on:
  push:
    branches: [agent/invitations-trusted-documents-roles]

jobs:
  inspect-identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production users and CRM identity counts
        run: |
          npx wrangler d1 execute pmv --remote --command "SELECT id,email,role,status,full_name,created_at FROM users ORDER BY created_at; SELECT COUNT(*) AS contact_inquiries FROM contact_inquiries; SELECT COUNT(*) AS client_profiles FROM client_profiles; SELECT COUNT(*) AS team_members FROM team_members;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
