name: One-off - set display name for cjenkins account

on:
  workflow_dispatch:

jobs:
  set-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify target account (before)
        run: |
          npx wrangler d1 execute pmv --remote --command "
            SELECT id, email, full_name FROM users WHERE email = 'cjenkins@pinnaclemanagementventures.com';
          "
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: Update full_name
        run: |
          npx wrangler d1 execute pmv --remote --command "
            UPDATE users SET full_name = 'C.R. Jenkins' WHERE email = 'cjenkins@pinnaclemanagementventures.com';
          "
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: Confirm
        run: |
          npx wrangler d1 execute pmv --remote --command "
            SELECT id, email, full_name FROM users WHERE email = 'cjenkins@pinnaclemanagementventures.com';
          "
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
