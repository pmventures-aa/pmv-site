name: HQ runtime hotfix validation

on:
  push:
    branches: ['fix/hq-runtime-internal-errors']

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair malformed relationship insert and guard against recurrence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('functions/_lib/routes/admin.ts')
          text = path.read_text()
          bad = "VALUES (?,'person',?,?,?,?,?)"
          good = "VALUES (?,'person',?,?,?,?)"
          if bad in text:
              text = text.replace(bad, good)
              path.write_text(text)
          for candidate in Path('functions').rglob('*.ts'):
              source = candidate.read_text()
              if 'relationship_parties(id,party_type,display_name,email,phone,created_by_user_id)' in source and bad in source:
                  raise SystemExit(f'malformed relationship_party insert remains in {candidate}')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit repaired source when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source repair needed.'
            exit 0
          fi
          git config user.name 'pmv-hq-reliability'
          git config user.email 'actions@users.noreply.github.com'
          git add functions/_lib/routes/admin.ts
          git commit -m 'Fix client profile relationship SQL binding'
          git push origin HEAD:${GITHUB_REF_NAME}
