name: Verify production automation authentication

on:
  workflow_run:
    workflows: ['Deploy Cloudflare Pages production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify refreshed production automation endpoints
        env:
          PMV_AUTOMATION_SECRET: ${{ secrets.PMV_AUTOMATION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PMV_AUTOMATION_SECRET"

          host='pmv-site.pages.dev'
          marker_url="https://$host/.well-known/pmv-automation-binding-v1.txt"
          echo "Confirming post-secret deployment on $host"

          marker=''
          for attempt in $(seq 1 24); do
            marker="$(curl --silent --show-error --max-time 10 "$marker_url" || true)"
            if [[ "$marker" == 'pmv-automation-binding-v1' ]]; then
              echo 'Refreshed Pages deployment confirmed.'
              break
            fi
            sleep 5
          done
          [[ "$marker" == 'pmv-automation-binding-v1' ]]

          health_body="$(mktemp)"
          health_status="$(curl --silent --show-error --output "$health_body" --write-out '%{http_code}' --max-time 15 "https://$host/api/health")"
          echo "Health returned HTTP $health_status"
          cat "$health_body"
          echo
          [[ "$health_status" -ge 200 && "$health_status" -lt 300 ]]

          check_endpoint() {
            local label="$1" path="$2" body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --request POST --header "x-pmv-automation-secret: $PMV_AUTOMATION_SECRET" "https://$host$path")"
            echo "$label returned HTTP $status"
            cat "$body"
            echo
            [[ "$status" -ge 200 && "$status" -lt 300 ]]
          }

          check_endpoint 'Client notifications' '/api/automation/client-notifications/run'
          check_endpoint 'Client nurture' '/api/automation/nurture/run'
          check_endpoint 'Public scope follow-up' '/api/automation/scope-followup/run'
          check_endpoint 'Scheduled reports' '/api/automation/reports/run'
          check_endpoint 'Document envelopes' '/api/automation/document-envelopes/run'
