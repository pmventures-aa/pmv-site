name: Apply document operations type fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-document-ops-types.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize D1 result casts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/_lib/routes/documentOperations.ts')
          s=p.read_text()
          s=s.replace('.first<any>()', '.first() as any')
          s=s.replace('.all<any>()', '.all() as any')
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name 'pmventures-aa'
          git config user.email 'c.raymondjenkins@gmail.com'
          git add functions/_lib/routes/documentOperations.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix document operations D1 typing'
          git push origin HEAD:main
