name: Validate CRM records expansion

on:
  push:
    branches: [agent/crm-records-communications]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations locally
        run: npm run db:migrate:local
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
