name: Validate PR36

on:
  push:
    branches:
      - agent/pr36-account-onboarding-emails
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply full local D1 migration history
        run: npm run db:migrate:local

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
