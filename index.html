<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinnacle Management Ventures | Professional Support. One Call Away.</title>
    <meta name="description" content="Business, property, and administrative matters handled through one trusted point of contact. Tell us what you need help with." />
    <link rel="canonical" href="https://www.pinnaclemanagementventures.com/" />

    <!-- Default Open Graph / Twitter cards. Non-JS social scrapers read the
         initial HTML, so these baseline tags must live here; usePageMeta
         overrides title/description/url per route for JS-rendering crawlers. -->
    <meta property="og:site_name" content="Pinnacle Management Ventures" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pinnacle Management Ventures | Professional Support. One Call Away." />
    <meta property="og:description" content="Business, property, and administrative matters handled through one trusted point of contact." />
    <meta property="og:url" content="https://www.pinnaclemanagementventures.com/" />
    <meta property="og:image" content="https://www.pinnaclemanagementventures.com/logo-crest-on-dark.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pinnacle Management Ventures | Professional Support. One Call Away." />
    <meta name="twitter:description" content="Business, property, and administrative matters handled through one trusted point of contact." />
    <meta name="twitter:image" content="https://www.pinnaclemanagementventures.com/logo-crest-on-dark.png" />

    <!-- Organization + WebSite structured data (static, so non-JS crawlers see it). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.pinnaclemanagementventures.com/#organization",
          "name": "Pinnacle Management Ventures",
          "url": "https://www.pinnaclemanagementventures.com/",
          "logo": "https://www.pinnaclemanagementventures.com/logo-crest-on-dark.png",
          "email": "support@pinnaclemanagementventures.com",
          "telephone": "+1-561-388-7879",
          "areaServed": "US",
          "description": "Pinnacle Management Ventures handles business, property, and administrative matters through one trusted point of contact, with direct South Florida field services across Miami-Dade, Broward, and Palm Beach.",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+1-561-388-7879",
            "email": "support@pinnaclemanagementventures.com",
            "contactType": "customer service",
            "areaServed": "US"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.pinnaclemanagementventures.com/#website",
          "name": "Pinnacle Management Ventures",
          "url": "https://www.pinnaclemanagementventures.com/",
          "publisher": { "@id": "https://www.pinnaclemanagementventures.com/#organization" }
        }
      ]
    }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B1F3A" />
    <script src="/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
